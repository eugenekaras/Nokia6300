name: Build Tetris for Nokia 6300

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download compiler and Java ME libraries
        run: |
          mkdir -p build/lib build/classes dist
          curl -fL https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.26.0/ecj-3.26.0.jar -o build/lib/ecj.jar
          curl -fL https://repo.maven.apache.org/maven2/org/microemu/cldcapi10/2.0.4/cldcapi10-2.0.4.jar -o build/lib/cldcapi10.jar
          curl -fL https://repo.maven.apache.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -o build/lib/midpapi20.jar

      - name: Compile Tetris
        run: |
          SRC=$(find . -type f -name 'Tetris.java' -not -path './build/*' -print -quit)
          if [ -z "$SRC" ]; then
            echo "Tetris.java not found. Add it as src/Tetris.java."
            exit 1
          fi
          java -jar build/lib/ecj.jar \
            -source 1.3 -target cldc1.1 \
            -bootclasspath build/lib/cldcapi10.jar:build/lib/midpapi20.jar \
            -d build/classes "$SRC"

      - name: Package JAR and JAD
        run: |
          printf '%s\n' \
            'Manifest-Version: 1.0' \
            'MIDlet-Name: Tetris' \
            'MIDlet-Version: 1.0.0' \
            'MIDlet-Vendor: Custom' \
            'MIDlet-1: Tetris,,Tetris' \
            'MicroEdition-Profile: MIDP-2.0' \
            'MicroEdition-Configuration: CLDC-1.1' \
            '' > build/MANIFEST.MF

          jar cfm dist/Tetris.jar build/MANIFEST.MF -C build/classes .

          SIZE=$(wc -c < dist/Tetris.jar | tr -d ' ')

          cat > dist/Tetris.jad <<EOF
          MIDlet-Name: Tetris
          MIDlet-Version: 1.0.0
          MIDlet-Vendor: Custom
          MIDlet-1: Tetris,,Tetris
          MIDlet-Jar-URL: Tetris.jar
          MIDlet-Jar-Size: $SIZE
          MicroEdition-Profile: MIDP-2.0
          MicroEdition-Configuration: CLDC-1.1
          EOF

      - name: Upload Tetris installation files
        uses: actions/upload-artifact@v4
        with:
          name: Tetris6300-installation-files
          path: |
            dist/Tetris.jar
            dist/Tetris.jad
          if-no-files-found: error
